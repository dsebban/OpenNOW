pcm.opennow_test_output {
    type null
    hint {
        show on
        description "OpenNOW isolated test output"
        ioid "Output"
    }
}

pcm.opennow_test_failing_output {
    type file
    slave.pcm "null"
    file "/dev/full"
    format "raw"
    hint {
        show on
        description "OpenNOW test output that fails once its buffer fills"
        ioid "Output"
    }
}

pcm.null {
    type null
}

# Name hints query installed card metadata before listing the fixture PCMs.
# Keep control enumeration available without adding any hardware playback PCM.
ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type string
    }
    type hw
    card $CARD
}
